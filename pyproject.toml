[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3

[tool.pytest.ini_options]
minversion = "6.0"
norecursedirs = ["scratch", ".git", ".venv", "venv"]
testpaths = [
    "apps",
    "test_deployment_suite.py",
    "test_social_accounts_suite.py",
    "test_media_assets_suite.py"
]
